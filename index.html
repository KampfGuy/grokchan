<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0f0d13"><title>Kanya-Chan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1792137478">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"}}</script></head>
<body class="home">
<div id="app">
 <header id="top">
  <button id="charbtn" class="charbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="charmenu" title="Switch character">
   <span class="pfp"><img id="chimg" src="thumbs/kanya.png" alt=""></span>
   <span class="meta"><h1 id="chname">Kanya-Chan</h1><span id="status" class="status"><i></i><span>online</span></span></span>
   <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="tools" id="tools"><div class="actions">
   <select id="model" aria-label="Model" title="Model"></select>
   <button id="spk" class="pill" type="button" aria-label="Voice mode"></button>
   <a href="pose.html" id="poselink" class="icon" aria-label="Pose editor" title="Pose editor"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2"/><path d="M5 9l7 1.5L19 9M12 10.5V15m0 0l-3.5 6M12 15l3.5 6"/></svg></a>
   <button id="new" class="icon" type="button" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  </div></div>
  <button id="collapse" class="icon ghosticon" type="button" aria-label="Collapse top bar" aria-expanded="true" title="Collapse top bar"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 </header>
 <div id="charmenu" class="charmenu" role="listbox" aria-label="Characters" hidden></div>
 <section id="stage">
  <div id="av"><canvas id="avc"></canvas><div id="avl"><div class="spinner"></div><span>Loading <b id="avn">Kanya-Chan</b>… <span id="avp">0%</span></span></div><div class="hint">Drag to rotate · double-tap to reset</div></div>
 </section>
 <section id="chat">
  <main id="log" aria-live="polite" data-empty="Say hi to Kanya-Chan"></main>
  <form id="f" autocomplete="off">
   <textarea id="q" rows="1" placeholder="Message Kanya-Chan…" enterkeyhint="send"></textarea>
   <button id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" fill="currentColor"/></svg></button>
  </form>
  <footer id="credit">Voice: VOICEVOX:四国めたん</footer>
 </section>
</div>
<div id="gate" hidden><form id="gf" class="card"><div class="pfp big"><img id="gimg" src="thumbs/kanya.png" alt=""></div><h2>Welcome back</h2><p>Enter the access password to chat with <span id="gname">Kanya-Chan</span>.</p>
 <input id="pw" type="password" placeholder="Access password" autocomplete="current-password"><button type="submit" class="primary">Enter</button><div id="gerr" class="gerr" hidden>Wrong password — try again.</div></form></div>
<script src="https://cdn.jsdelivr.net/npm/marked@14.1.4/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script><script src="cast.js?v=1792137478"></script><script src="app.js?v=1792137478"></script><script type="module" src="avatar.js?v=1792137478"></script></body></html>
